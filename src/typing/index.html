<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Test</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="bar"><span id="info" aria-live="polite"></span><span id="best"></span><label>Time <select id="secs"><option>15s</option><option>30s</option><option>60s</option></select></label><button class="primary" id="restart">New game</button></div>
    <div id="stage" tabindex="0" aria-label="Typing Test game area"></div>
    <p class="hint" id="msg" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
