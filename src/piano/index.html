<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="row">
  <label>Wave <select id="wave"><option>sine</option><option selected>triangle</option><option>square</option><option>sawtooth</option></select></label>
  <label>Octave <select id="oct"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5"></label>
</div>
<div id="kb" role="group" aria-label="Piano keys"></div>
<p class="muted">Play with the mouse or the keyboard: A W S E D F T G Y H U J K O L P ; (white keys on the home row, black keys above).</p>
<script src="app.js"></script>
</body>
</html>
