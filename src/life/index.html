<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game of Life</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="bar"><span id="info" aria-live="polite"></span><span id="best"></span><button class="primary" id="restart">New game</button></div>
    <div id="stage" tabindex="0" aria-label="Game of Life game area"></div>
    <p class="hint" id="msg" aria-live="polite"></p><div id="ctl">
    <button id="run" class="primary">Run</button><button id="step">Step</button><button id="rand">Random</button>
    <label>Pattern <select id="pat"><option>Glider</option><option>Blinker</option><option>Pulsar</option><option>Lightweight spaceship</option><option>R-pentomino</option><option>Gosper glider gun</option></select></label>
    <button id="place">Place</button>
    <label>Speed <input type="range" id="speed" min="1" max="30" value="10"></label>
  </div>

  </main>
  <script src="app.js"></script>
</body>
</html>
