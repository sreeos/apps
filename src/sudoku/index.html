<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="bar"><span id="info" aria-live="polite"></span><span id="best"></span><label>Level <select id="level"><option>Easy</option><option>Medium</option><option>Hard</option></select></label><button id="notes">Notes: off</button><button id="check">Check</button><button class="primary" id="restart">New game</button></div>
    <div id="stage" tabindex="0" aria-label="Sudoku game area"></div>
    <p class="hint" id="msg" aria-live="polite"></p><div id="pad"></div>

  </main>
  <script src="app.js"></script>
</body>
</html>
