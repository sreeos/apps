<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-Tac-Toe</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="bar"><span id="info" aria-live="polite"></span><span id="best"></span><label>Mode <select id="mode"><option>vs AI</option><option>2 players</option></select></label><button class="primary" id="restart">New game</button></div>
    <div id="stage" tabindex="0" aria-label="Tic-Tac-Toe game area"></div>
    <p class="hint" id="msg" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
