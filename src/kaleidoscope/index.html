<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaleidoscope</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="row">
  <label>Segments <input type="range" id="n" min="2" max="16" value="8"><output id="no">8</output></label>
  <label>Size <input type="range" id="size" min="1" max="20" value="3"></label>
  <label><input type="checkbox" id="mirror" checked> Mirror</label>
  <label><input type="checkbox" id="rainbow" checked> Rainbow</label>
  <label>Color <input type="color" id="color" value="#ff66aa"></label>
  <button id="clear">Clear</button>
</div>
<canvas id="c" width="520" height="520" aria-label="Kaleidoscope canvas. Draw with the pointer."></canvas>
<script src="app.js"></script>
</body>
</html>
