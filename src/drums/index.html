<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drum Machine</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="row">
  <button id="go" class="primary">Play</button>
  <label>Tempo <input type="range" id="bpm" min="60" max="200" value="110"><output id="bpmo">110</output> BPM</label>
  <button id="clear">Clear pattern</button>
</div>
<div id="pads" role="group" aria-label="Pads"></div>
<div id="grid" role="group" aria-label="Step sequencer"></div>
<script src="app.js"></script>
</body>
</html>
