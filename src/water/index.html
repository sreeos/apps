<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="ring"><div id="pct">0%</div><div class="muted" id="amt"></div></div>
  <div class="row" id="quick" style="justify-content:center"></div>
  <form class="row" id="f"><input id="custom" type="number" min="1" aria-label="Custom amount (ml)" placeholder="Custom ml"><button>Add</button></form>
  <form class="row" id="gf"><label style="flex:1">Daily goal (ml)<input id="goal" type="number" min="100" step="50"></label></form>
  <div class="row"><button id="undo">Undo last</button></div>
  <h2>Last 7 days</h2><div id="hist"></div>
  <script src="app.js"></script>
</body>
</html>
