<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form class="row" id="f"><input id="t" aria-label="New task" placeholder="Add a task…" autocomplete="off"><button class="primary">Add</button></form>
  <div class="row" id="filters" role="group" aria-label="Filter"></div>
  <ul id="list"></ul>
  <div class="row"><span class="muted" id="count"></span><button id="clear">Clear completed</button></div>
  <script src="app.js"></script>
</body>
</html>
