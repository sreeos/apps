<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Splitter</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form id="f">
    <label>Bill amount<input id="bill" type="number" min="0" step="0.01" value="50"></label>
    <label>Tip: <span id="pv">15</span>%<input id="pct" type="range" min="0" max="40" value="15"></label>
    <div class="row" id="presets"></div>
    <label>People<input id="n" type="number" min="1" value="2"></label>
  </form>
  <div class="card" id="out"></div>
  <script src="app.js"></script>
</body>
</html>
