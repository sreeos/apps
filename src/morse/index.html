<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morse</title><link rel="stylesheet" href="style.css"></head>
<body>
<label for="text">Text</label>
<textarea id="text" rows="3">SOS HELLO</textarea>
<div class="row"><button id="toM">Text to Morse</button><button id="toT">Morse to text</button></div>
<label for="morse">Morse (use . and - ; space between letters, / between words)</label>
<textarea id="morse" rows="3"></textarea>
<div class="row">
  <button id="play" class="primary">Play</button><button id="stop">Stop</button>
  <label>Speed <input type="range" id="wpm" min="5" max="30" value="15"><output id="wpmo">15 WPM</output></label>
  <label>Tone <input type="range" id="hz" min="300" max="1000" value="600"></label>
</div>
<div id="lamp" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
