<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speak</title><link rel="stylesheet" href="style.css"></head>
<body>
<label for="t">Text to speak</label>
<textarea id="t" rows="8">Hello from SreeOS. Type anything here and press Speak.</textarea>
<div class="grid">
  <label>Voice <select id="v"></select></label>
  <label>Rate <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><output></output></label>
  <label>Pitch <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><output></output></label>
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.1" value="1"><output></output></label>
</div>
<div class="row"><button id="go" class="primary">Speak</button><button id="pause">Pause</button><button id="stop">Stop</button><span id="msg" class="muted" role="status"></span></div>
<script src="app.js"></script>
</body>
</html>
