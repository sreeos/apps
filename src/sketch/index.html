<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sketch</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="row">
  <label>Color <input type="color" id="color" value="#2a6df4"></label>
  <label>Size <input type="range" id="size" min="1" max="60" value="6"><output id="sizeo">6</output></label>
  <button id="pen" class="on">Pen</button><button id="eraser">Eraser</button>
  <button id="undo">Undo</button><button id="clear">Clear</button>
  <button id="save" class="primary">Save to Pictures</button>
  <span id="msg" class="muted" role="status"></span>
</div>
<canvas id="c" width="720" height="440" aria-label="Drawing canvas"></canvas>
<script src="app.js"></script>
</body>
</html>
