<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form class="row" id="f"><input id="title" aria-label="Title" placeholder="Title" required autocomplete="off"><input id="url" aria-label="Link" placeholder="https://…" required autocomplete="off"><input id="tags" aria-label="Tags (comma separated)" placeholder="tags, comma, separated" autocomplete="off"><button class="primary">Save</button></form>
  <div class="row"><input id="q" type="search" aria-label="Search" placeholder="Search…"></div>
  <div class="row" id="tagbar" role="group" aria-label="Tags"></div>
  <ul id="list"></ul>
  <script src="app.js"></script>
</body>
</html>
