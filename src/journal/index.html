<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal</title><link rel="stylesheet" href="style.css"></head>
<body>
  <aside><button class="primary" id="add">New entry</button><ul id="list"></ul></aside>
  <main><div class="row"><label>Date<input type="date" id="date"></label><label style="flex:1">Title<input id="title" placeholder="Title"></label></div><textarea id="text" aria-label="Entry" placeholder="Write about your day…"></textarea><div class="row"><span class="muted" id="status" style="flex:1"></span><button id="del">Delete entry</button></div></main>
  <script src="app.js"></script>
</body>
</html>
